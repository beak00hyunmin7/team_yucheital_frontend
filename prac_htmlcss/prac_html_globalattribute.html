<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Attributes</title>
</head>
<body>
    <p> 글로벌 속성 : 태그의 종류 상관 없이 사용할 수 있는 것들</p>
    <p> class 여러개, id 고유속성, style css적용 관련, title 추가적인 정보 툴팁표시, hidden 숨기기 lang 언어텍스트 종류</p>
    <p class = "test" id = "test" style = "color:red;" title = "추가적인 정보 툴팁표시" hidden lang = "ko">글로벌 속성 테스트</p>
</body>
</html>
