<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>폼(form)</title>
</head>
<body>
    <form action = "" method = "">
        <label>아이디 : </label><input type="text" />
        <br>
        <label>비밀번호 : </label><input type="password" />
        <br>
        <label for="id">아이디 : </label><input type="text" id="id" />
        <br>
        <label> 아이디 : <input type="text" /></label>

        <!-- fieldset (그룹화)-->
        <!-- legend (제목)-->
        <fieldset>
            <legend>개인 정보</legend>
            <label>이름 : </label><input type="text" />
            <br>
            <label>나이 : </label><input type="number" />
            <br>
            <label>성별 : 남 <input type = "radio"> 여 <input type = "radio"></label>

        </fieldset>
        <br>
        <select>
            <option value = "male">남</option>
            <option value = "female" selected>여</option>
        </select>

        <!-- optgroup -->
        <select>
            <optgroup label = "남자">
                <option value = "1">홍길동</option>
                <option value = "2">이순신</option>
            </optgroup>
            <optgroup label = "여자">
                <option value = "3">유관순</option>
                <option value = "4">신사임당</option>
            </optgroup>
        </select>
        <!-- button-->
        <br>
        <button> 일반 버튼 </button>
        <button disabled> disabled 버튼 </button>
        <input type = "text" readonly />
        <input type = "text" maxlength = "5"/>
        <input type = "checkbox" checked/> 
    </form>
</body>
</html>
