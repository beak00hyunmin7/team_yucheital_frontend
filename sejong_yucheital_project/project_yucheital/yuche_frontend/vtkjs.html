<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vtk.js viewer</title>
    <!-- vtk.js 라이브러리 로드 -->
    <script src="https://unpkg.com/vtk.js"></script>
    <link rel="stylesheet" href = "./style.css">
</head>
<body>
    <div class="layout">
        <!-- 파일 받기 -->
        <div class="upload-panel" style = "margin-top : 20px;">
            <h1> 등고선 업로드 </h1>
            <form id="uploadForm" enctype="multipart/form-data">
                <input type="file" style="padding: 10px 20px; font-size: 20px" id="fileInput" name="file" accept=".jpg, .png, .jpeg, .dem" />
                <div class="form-row">
                    <label>배수구 개수</label>
                    <input type="number" id="drainCount" value="3" min="1" max="10" step="1">
                </div>

                <div class="form-row">
                    <label>시간당강수량(rainfall_mm_per_hour)</label>
                    <input type="number" id="rainfall" value="10" min="1" max="1000" step="1">
                </div>

                <div class="form-row">
                    <label>유출계수(runoff_coefficient)</label>
                    <input type="number" id="runoffCoefficient" value="0.8" min="0" max="1" step="0.1">
                </div>

                <div class="form-row">
                    <label>셀 크기(미터)(cell_size_m)</label>
                    <input type="number" id="cellSize" value="10" min="1" max="10000" step="1">
                </div>

                <div class="form-row">
                    <label>최소 간격 비율(minimum_spacing_ratio)</label>
                    <input type="number" id="minimumSpacingRatio" value="0.1" min="0.01" max="0.5" step="0.01">
                </div>

                <div class="form-row">
                    <label>흐림 반경(blur_radius)</label>
                    <input type="number" id="blurRadius" value="1.2" min="0" max="10" step="0.1">
                </div>

                <div class="form-row">
                    <label>지형 밝기 해석(high_is_bright)</label>
                    <label><input type="checkbox" id="highIsBright" checked> 밝을수록 높은 지형</label>
                </div>

                <div class="form-row">
                    <label>중첩 레이어 포함(include_overlay)</label>
                    <label><input type="checkbox" id="includeOverlay" checked> 중첩 레이어 포함</label>
                </div>
                
                
                
            <!---
            <h1> 등고선 업로드 </h1>
            
                <input type="file" style="padding: 10px 20px; font-size: 20px;" id="mapInput" name="map" accept=".jpg, .png, .jpeg" />-->
                <br />
                <br />
                <button type="submit" style="padding: 10px 20px; font-size: 20px;">지도 사진 업로드</button>
            </form>
        </div>  

        <!-- 결과 컨테이너 -->
        <div class="viewer-panel">
            <img id="overlay" style="display: none;" />
            <p id="viewer-placeholder">이미지를 업로드하면 결과가 표시됩니다</p>
        </div>
    </div>

    <!-- <div class="result-panel">
        <h2>분석 결과</h2>
        <img id="overlay" style="display: none;" />
    </div> -->

    <!-- 회원가입/로그인 버튼 영역 -->
    <div id="top-right-nav">
        <button onclick="openAuthModal('login')">로그인</button>
        <button onclick="openAuthModal('signup')">회원가입</button>
    </div>

    <!-- 로그인/회원가입 모달 -> 다른창으로 넘어가는것처럼 보이는것, 즉 덮여씌운다 느낌 (평소엔 숨겨져 있음) -->
    <div id="auth-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5);">
    
    <div style="background: white; width: 300px; margin: 100px auto; padding: 20px; border-radius: 8px;">
        
        <!-- 제목자리. JS로 나중에 "로그인" 또는 "회원가입"으로 바꿔줄 예정. id는-->
        <h3 id="modal-title"></h3>

        <input type="email" id="email-input" placeholder="이메일" style="width: 100%; margin-bottom: 10px;">
        <input type="password" id="password-input" placeholder="비밀번호" style="width: 100%; margin-bottom: 10px;">

        <!-- 제출 버튼. id는 "modal-submit-btn", onclick 함수 submitAuth() 연결 -->
        <button id="modal-submit-btn" onclick="submitAuth()">확인</button>

        <!-- 닫기 버튼. onclick 함수 closeAuthModal() 연결 -->
        <button onclick="closeAuthModal()">닫기</button>

        <p id="auth-message" style="color: red;"></p>
    </div>
    </div>

    <script>
        //const container = document.getElementById('container');
        
        const ANALYZE_API = 'http://172.16.52.25:8000';
        
      // 렌더링을 위한 기본 컨테이너 설정
        // const fullScreenRenderer = vtk.Rendering.Misc.vtkFullScreenRenderWindow.newInstance({
        // rootContainer: container,
        // containerStyle: { width: '100%', height: '100%', position: 'relative' }
        // });

        // const renderer = fullScreenRenderer.getRenderer();
        // const renderWindow = fullScreenRenderer.getRenderWindow();

      // .vtkjs 파일을 불러오는 로더 생성
        // const reader = vtk.IO.Core.vtkHttpSceneLoader.newInstance({ renderer: renderer });



        // 현재 모달이 로그인 모드인지 회원가입 모드인지 저장해두는 변수
        let currentAuthMode = null;

        function openAuthModal(mode) {
        currentAuthMode = mode; // 'login' 또는 'signup'

        const modal = document.getElementById('auth-modal');
        const title = document.getElementById('modal-title');
        const message = document.getElementById('auth-message');

        // 입력창, 메시지 초기화
        document.getElementById('email-input').value = '';
        document.getElementById('password-input').value = '';
        message.textContent = '';

        title.textContent = (mode === 'login') ? '로그인' : '회원가입';

        modal.style.display = 'block'; // 숨겨져 있던 모달을 보이게 함
        }

        function closeAuthModal() {
        document.getElementById('auth-modal').style.display = 'none';
        }

        async function submitAuth() {
        const email = document.getElementById('email-input').value;
        const password = document.getElementById('password-input').value;
        const message = document.getElementById('auth-message');

        // 어느 주소로 보낼지 mode에 따라 결정
        const endpoint = (currentAuthMode === 'login') ? '/login' : '/signup';
        const url = 'http://127.0.0.1:8000' + endpoint;

        try {
            const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, password: password })
            });

            const data = await response.json();

            if (!response.ok) {
            // 서버가 에러를 던진 경우 (400, 401 등)
            message.style.color = 'red';
            message.textContent = data.detail || '오류가 발생했습니다.';
            return;
            }

            // 성공
            message.style.color = 'green';
            if (currentAuthMode === 'login') {
            message.textContent = '로그인 성공!';
            } else {
            message.textContent = `회원가입 성공! (${data.email})`;
            }

        } catch (err) {
            message.style.color = 'red';
            message.textContent = '서버에 연결할 수 없습니다.';
            console.error(err);
        }
        }

        document.getElementById('uploadForm').addEventListener('submit', async(e) => { //id가 "uploadform"인 요소를 찾아와서 폼이 제출될때 함수를 실행해라
            e.preventDefault(); // 브라우저 새로고침하지마!

            const btn = e.target.querySelector('button[type="submit"]');
            
            const mapFile = document.getElementById('fileInput').files[0];
            //const contourFile = document.getElementById('mapInput').files[0];
            
            if (!mapFile) {
                alert('사진을 업로드해주세요.');
                return;
            }

            const formData = new FormData(); //파일 서버로 보내기 위한 함수 -> 파일은 바이너리이기때문에 이 명령어로 파일을 담는?
            formData.append('image', mapFile);
            //formData.append('contour_image', contourFile);
            formData.append('drain_count', document.getElementById('drainCount').value);
            formData.append('rainfall_mm_per_hour', document.getElementById('rainfall').value);
            formData.append('runoff_coefficient', document.getElementById('runoffCoefficient').value);
            formData.append('cell_size_m', document.getElementById('cellSize').value);
            formData.append('minimum_spacing_ratio', document.getElementById('minimumSpacingRatio').value);
            formData.append('blur_radius', document.getElementById('blurRadius').value);
            formData.append('high_is_bright', document.getElementById('highIsBright').checked);
            formData.append('include_overlay', document.getElementById('includeOverlay').checked);
            for (const [key, value] of formData.entries()) {
            console.log(key, value);
            }


            btn.disabled = true; //버튼 비활성화
            btn.textContent = '업로드 중...'; //버튼 글자 바꾸기

            try {
                const res = await fetch('http://172.16.52.25:8000/api/v1/drainage/analyze',{ //백엔드 주소 서버 -> 나중에 수정해야될듯?
                    method: 'POST', //POST 방식으로 보내기
                    body: formData // formdata를 body에 담아서 보내기
                });

                if (!res.ok) {
                    throw new Error(`서버 오류 (${res.status})`); //서버가 오류인경우 응답상태와 함께 콘솔로그 띄우기
                }

                const data = await res.json(); //서버에서 json형식으로 응답받기
                console.log('서버 응답:', data);

                const overlay = document.getElementById('overlay'); //업로드 후 결과값 도출해내기
                overlay.src = ANALYZE_API + data.overlay_image_url;
                overlay.style.display = 'block';
                document.getElementById('viewer-placeholder').style.display = 'none';
            } catch (err) { //접속이 안된다면?
                console.error(err);
                alert('서버 연결 불가') //에러메시지 보내기
            } finally {
                btn.disabled = false; //버튼 활성화
                btn.textContent = '지도 사진 업로드'; //버튼 글자 바꾸기
            }
        });
    </script>

</body>
</html>
