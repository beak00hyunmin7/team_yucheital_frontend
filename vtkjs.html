<!-- vtk.js 라이브러리 로드 -->
<script src="https://unpkg.com/vtk.js"></script>

<div id="container" style="width: 100%; height: 500px; background-color: #000;"></div>

<script>
  const container = document.getElementById('container');
  
  // 렌더링을 위한 기본 컨테이너 설정
  const fullScreenRenderer = vtk.Rendering.Misc.vtkFullScreenRenderWindow.newInstance({
    rootContainer: container,
    containerStyle: { width: '100%', height: '100%', position: 'relative' }
  });

  const renderer = fullScreenRenderer.getRenderer();
  const renderWindow = fullScreenRenderer.getRenderWindow();

  // .vtkjs 파일을 불러오는 로더 생성
  const reader = vtk.IO.Core.vtkHttpSceneLoader.newInstance({ renderer: renderer });
  
  // 파일 로드가 완료되었을 때 실행될 이벤트 리스너 등록
  reader.onReady(() => {
    renderer.resetCamera();
    renderWindow.render();
    console.log("3D 씬 로드 완료!");
  });

  // 실제 파일 경로 설정 (여기에 본인의 vtkjs 파일 경로를 넣으세요)
  reader.setUrl('models/my_data.vtkjs'); 
</script>
